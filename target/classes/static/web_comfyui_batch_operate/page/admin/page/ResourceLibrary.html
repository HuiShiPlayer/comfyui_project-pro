<script>

		$('.contentHolder').perfectScrollbar();
	});
</script>
<link rel="stylesheet" href="./css/resources.css">
<script>
	$(function() {
		$('.contentHolder').perfectScrollbar();
	});

	function toggleSelect(el) {
		el.classList.toggle('checked');
	}
</script>
<section id="main">
	<div class="contentHolder ng-scope ps-container" style="padding-top: 15px;">
		<div class="container-fluid">
			<main class="container" v-cloak>

				<div class="row">
					<div class="col-sm-12">
						<div class="list-box">
							<div class="form-group" style="float: left;">

								<div class="input-icon-right" style="float:left;">
									<input v-model="name" type="text" class="form-control" placeholder="名称查询"> <i
										class="icon-search f18 text-666"></i>
								</div>
								<div style="float: left;margin-left: 10px;">
									<button type="" class="custom-btn custom-btn-success"
										@click="getAllFile(0)">查询</button>
								</div>

							</div>
							<div class="float-r">
								<input @change="getLocalFiles" type="file" multiple id="localFiles" accept="image/*"
									style="display: none;">
								<button type="button" class="custom-btn modalhide custom-btn-primary" id=""
									@click="uploadFiles">上传文件</button>
							</div>
							<div style="clear: both;"></div>
						</div>
					</div>
				</div>
				<div class="media-list-bar">
					<div class="media-list-title"><span>图片列表</span><span class="media-list-count">共
							{{totalCount}} 张</span></div>
					<div class="media-cat-filter" tabindex="0" title="按类别筛选"><span class="media-cat-chip"><span
								class="media-cat-chip-label">类别</span><span class="media-cat-chip-value">全部</span><span
								class="media-cat-caret"></span></span>
						<ul class="media-cat-menu">
							<li>
								<button type="button" class="media-cat-option" data-cat="all" @click="getClassResource(null)">全部</button>
							</li>
							<li v-for="classItem in classTypes">
								<button type="button" class="media-cat-option" :data-cat="classItem.name" @click="getClassResource(classItem)">{{classItem.name}}</button>
							</li>
							
						</ul>
					</div>
				</div>
				<div id="media-container" class="media-grid" style="margin-top: 10px;">
					<div v-for="(item,index) in list" class="media-card content-auto"
						style="opacity: 1; transform: translateY(0px); transition: opacity 0.5s, transform 0.5s;">
						<div class="media-content media-video-container">
							<button type="button" class="media-preview-link" :data-preview-target="item.id">
								<img :src="item.localUrl+'?timestamp='+currentTime" :title="item.name"
									class="media-video" width="100%" height="auto" decoding="async"  loading="lazy">
							</button>
						</div>
						<div class="media-info">
							<div class="media-meta">
								<div class="media-name-row">
									<span class="media-label">图片名称</span>
									<h3 class="media-title media-name" @blur="editName(item)" :id="'resourceName'+item.id" contenteditable="true" spellcheck="false"
										title="点击名称可直接编辑">{{item.name}}</h3>

								</div>
								<div class="media-cat-row"><span class="media-label">图片类别</span>
									<div class="media-cat-controls"><span class="media-cat-value"
											:data-cat="item.className">{{item.className}}</span>
										<div class="cat-select" tabindex="0"><button type="button" class="cat-edit-btn"
												data-action="edit-cat">修改类别</button>
											<ul class="cat-menu" >
												<li v-for="classItem in classTypes">
													<button type="button" class="cat-option" :data-cat="classItem.name" @click="updateClass(item,classItem)">{{classItem.name}}</button>
												</li>												
											</ul>
										</div>
									</div>
								</div>
							</div>
							<div class="media-actions">
								<button type="button" class="custom-btn custom-btn-primary"
									style="border-radius: 10px;" @click="downLoad(item)">下载
								</button>
								<button type="button" data-toggle="modal" data-target="#deleteItem"
									class="custom-btn custom-btn-danger" style="border-radius: 10px;" @click="deleteItem(item)">删除
								</button>
							</div>
						</div>

					</div>



				</div>
				<!-- 加载指示器 -->
				<div id="loading-indicator" class="loading-indicator hidden">
					<div class="spinner"></div>
					<span class="loading-text">加载中...</span>
				</div>				
			</main>
		
		</div>
	<footer>
		<div class="container">
			<div class="footer-content">
				<p><button type="button" class="custom-btn custom-btn-primary " id="" @click="showHome()">绘世玩家主页</button> | <button type="button" class="custom-btn custom-btn-default " id="" @click="addMore()">点击加载更多</button></p>
			</div>
		</div>
	</footer>
	</div>
	
	<section v-for="(item,index) in list">
		<div class="preview-overlay" :data-preview="item.id" role="dialog" aria-modal="true">
			<div class="preview-backdrop" data-close="preview"></div>
			<div class="preview-box"><button type="button" class="preview-close" data-close="preview"
					title="关闭预览">✕</button><img :src="item.localUrl+'?timestamp='+currentTime" class="preview-img"
					alt="图片预览"><button type="button" class="preview-cancel" data-close="preview">取消</button></div>
		</div>

	</section>
</section>
<script type="text/javascript">
	(function() {
		'use strict';

		var main = document.getElementById('main');

		/* ---------------- 图片全屏预览 ---------------- */
		function openPreview(id) {
			var ov = document.querySelector('.preview-overlay[data-preview="' + id + '"]');
			console.log("ov:" + ov)
			if (ov) {
				ov.classList.add('open');
			}
		}

		function closeAllPreviews() {
			var list = document.querySelectorAll('.preview-overlay.open');
			for (var i = 0; i < list.length; i++) {
				list[i].classList.remove('open');
			}
		}

		/* ---------------- 类别下拉 ---------------- */
		// 有下拉打开时，给主内容区加 menu-open，放开 overflow 裁剪，避免被截断
		function syncOverflow() {
			if (!main) {
				return;
			}
			var open = document.querySelectorAll('.cat-select.open, .media-cat-filter.open');
			main.classList.toggle('menu-open', open.length > 0);
		}

		function closeMenus() {
			var list = document.querySelectorAll('.cat-select.open, .media-cat-filter.open');
			for (var i = 0; i < list.length; i++) {
				list[i].classList.remove('open');
			}
			var cards = document.querySelectorAll('.media-card.dropdown-open');
			for (var j = 0; j < cards.length; j++) {
				cards[j].classList.remove('dropdown-open');
			}
			syncOverflow();
		}

		// 下方空间不足时，让下拉向上弹出，保证所有选项可见
		function fitMenu(menu) {
			if (!menu) {
				return;
			}
			menu.classList.remove('up');
			var limit;
			if (main) {
				var mr = main.getBoundingClientRect();
				limit = Math.min(window.innerHeight, mr.bottom);
			} else {
				limit = window.innerHeight;
			}
			var r = menu.getBoundingClientRect();
			if (r.bottom > limit - 8) {
				menu.classList.add('up');
			}
		}

		function toggleMenu(host) {
			var willOpen = !host.classList.contains('open');
			closeMenus();
			if (willOpen) {
				host.classList.add('open');
				var card = host.closest('.media-card');
				if (card) {
					card.classList.add('dropdown-open');
				}
				var menu = host.querySelector('.cat-menu, .media-cat-menu');
				if (menu) {
					fitMenu(menu);
				}
			}
			syncOverflow();
		}

		// 点击类别选项：写入卡片类别 / 更新顶部筛选文字，并收起下拉
		function applyCategory(option, host) {
			var cat = option.getAttribute('data-cat');
			var text = option.textContent;
			if (host.classList.contains('cat-select')) {
				var chip = host.closest('.media-cat-controls').querySelector('.media-cat-value');
				if (chip) {
					chip.textContent = text;
					chip.setAttribute('data-cat', cat);
				}
			} else {
				var label = host.querySelector('.media-cat-chip-value');
				if (label) {
					label.textContent = text;
				}
			}
		}

		/* ---------------- 事件绑定 ---------------- */
		document.addEventListener('click', function(e) {
			// 点击图片 -> 打开预览
			var link = e.target.closest('.media-preview-link');
			if (link) {
				var id = link.getAttribute('data-preview-target');
				if (id) {
					console.log("id:" + id)
					openPreview(id);
				}
				return;
			}

			// 点击 ✕ / 取消 / 半透明背景 -> 关闭预览
			var closer = e.target.closest('[data-close="preview"]');
			if (closer) {
				closeAllPreviews();
				return;
			}

			// 点击类别选项 -> 应用类别并收起下拉
			var option = e.target.closest('.cat-option, .media-cat-option');
			if (option) {
				var hostSel = option.closest('.cat-select, .media-cat-filter');
				if (hostSel) {
					applyCategory(option, hostSel);
				}
				closeMenus();
				return;
			}

			// 点击顶部“类别 全部”胶囊 -> 开/关筛选下拉
			var chipBtn = e.target.closest('.media-cat-chip');
			if (chipBtn) {
				var fhost = chipBtn.closest('.media-cat-filter');
				if (fhost) {
					toggleMenu(fhost);
				}
				return;
			}

			// 点击“修改类别”按钮 -> 开/关下拉
			var btn = e.target.closest('.cat-edit-btn');
			if (btn) {
				var host2 = btn.closest('.cat-select');
				if (host2) {
					toggleMenu(host2);
				}
				return;
			}

			// 点击其他区域 -> 关闭所有下拉
			if (!e.target.closest('.cat-select, .media-cat-filter')) {
				closeMenus();
			}
		});

		// Esc 关闭预览和下拉
		document.addEventListener('keydown', function(e) {
			if (e.key === 'Escape' || e.keyCode === 27) {
				closeAllPreviews();
				closeMenus();
			}
		});
	})();
</script>
<script src="./page/vue/ResourceLibrary-vue.js"></script>
