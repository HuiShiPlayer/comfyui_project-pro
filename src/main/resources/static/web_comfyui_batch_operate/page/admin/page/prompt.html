<!--浏览分类-->

<script>
	$(function() {
		$('.contentHolder').perfectScrollbar();
	});
</script>
<style type="text/css">
	.showtext {
		width: 6em;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}
	.reimage {
	  transition: box-shadow 0.3s ease; /* 平滑过渡效果 */
	}
	
	.reimage:hover {
	   box-shadow: 0 0 10px rgba(255, 255, 255, 0.9); /* 白色发光效果 */
	  
	}
	.image-container {
			display: inline;
	   position: relative;
	   display: inline-block;
	 }
	.delete-icon {
	  position: absolute;
	  top: 0;
	  right: 0;
	  width: 20px; /* 调整叉号的大小 */
	  height: 20px; /* 调整叉号的大小 */
				border-radius: 50%;
	  background-color: red;
	  color: white;
	  display: flex;
	  justify-content: center;
	  align-items: center;
	  cursor: pointer;
	  font-weight: bold;
	}
</style>
<div class="contentHolder ng-scope ps-container" id="main">
	<div class="container-fluid" v-cloak>

		<!--面包屑导航-->
		<div class="row">
			<ol class="breadcrumb">
				<li>当前位置</li>
				<li>基础管理</li>
				<li>提示词记录</li>
			</ol>
		</div>
		<!--面包屑导航结束-->
		<!--主题内容开始-->

		<div class="row">
			<div class="col-sm-12">
				<div class="list-box">
					<div class="form-group" style="float: left;">
						<div class="input-icon-right" style="float:left">
							<input v-model="name" type="text" class="form-control" placeholder="查询"> <i class="icon-search f18 text-666"></i>
						</div>
					</div>
					<div class="form-group" style="float: left; margin-left: 10px;">
						<select class="form-control"  v-model="classId">
							<option  value= "-1" >分类</option>
							<option v-for="(item,index) in classes" :value="item.id" >{{item.name}}</option>							
						</select>
					</div>
					<div style="float: left;margin-left: 10px;">
						<button type="" class="custom-btn custom-btn-success" @click="select(1)">查询</button>
					</div>

					<div class="float-r">
						<button type="" class="custom-btn custom-btn-warning" data-toggle="modal" data-target="#classesManage">分类管理</button>
						<button type="" class="custom-btn custom-btn-primary" data-toggle="modal" data-target="#addData" @click="restform()">添加</button>
					</div>
					<br />
					<table class="dataTable row-border m-t-md">
						<thead>
							<tr>
								<th width="5%">序号</th>
								<th width="15%">名称</th>
								<th width="40%">提示词</th>
								<th width="10%"  style="text-align: center;">分类</th>
								<th width="15%" style="text-align: center;">预览</th>
								<th width="15%"><i class="icon-set-line fw"></i>操作</th>
							</tr>
						</thead>
						<tbody>
							<tr v-for="(item,index) in list">
								<td>{{index+1}}</td>
								<td>
									{{item.name}}
								</td>
								<td>
									{{item.prompt}}
								</td>

								<td  style="text-align: center;">
									{{item.className}}
								</td>

								<td style="text-align: center;">
									
										<section class="image-container">
											<img  v-if="!item.tips" @click="selectImage(index,item)" src="img/bg_image_2.png" width="100" height="100" class="reimage">
											<img  style="border-radius: 5px; overflow: hidden;max-width: 110px;max-height: 110px;" v-else @click="selectImage(index,item)" :src="item.tips+'?timestamp='+currentTime"  class="reimage">
											
											
											<div v-if="item.tips" class="delete-icon" title="删除" @click="deleteImage(item)">X</div>
										</section>
									
									
									
									<input @change="handleImageUpload" type="file" :id="index +'_uploadImage'"  accept="image/*" style="display: none;">
								</td>
								<td>
									<button class="custom-btn custom-btn-warning pd-md" data-toggle="modal" data-target="#addData" @click="setItem(item)">修改</button>
									<button class="custom-btn custom-btn-danger pd-md" data-toggle="modal" data-target="#deleteItem" @click="setItem(item)">删除</button>
								</td>
							</tr>
						</tbody>
					</table>
					<div class="M-box1" style="float: right; margin-top: 10px"></div>
				</div>
			</div>
		</div>
		
		<!--主题内容结束-->
		<div class="modal fade" id="classesManage" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
			<div class="modal-dialog" style="width: 800px">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
						<h4 class="modal-title" id="myModalLabel"><button class="custom-btn custom-btn-success pd-md" @click="addRow">添加一行</button></h4>
					</div>
					<div class="modal-body">
						<table class="dataTable row-border m-t-md">
							<thead>
								<tr>
									<th width="10%">序号</th>
									<th width="60%">分类名称</th>									
									<th  width="30%"><i class="icon-set-line fw"></i>操作</th>
								</tr>
							</thead>
							<tbody>
								<tr v-for="(item,index) in classes">
									<td>{{index+1}}</td>
									<td>
										<input v-model="item.name" class="form-control">
									</td>
									<td>										
										<button class="custom-btn custom-btn-warning pd-md" @click="updateClass(item)">确认</button>
										<button class="custom-btn custom-btn-danger pd-md"  @click="deleteClass(item,index)">删除</button>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
					<div class="modal-footer">
						<button type="button" class="custom-btn custom-btn-primary " data-dismiss="modal">关闭
						</button>
					</div>
				</div>
			</div>
		
		</div>
		
		<div class="modal fade" id="deleteItem" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
			<div class="modal-dialog modal-center modal-300">
				<div class="modal-content text-center">
					<div class="modal-body modal-animation ">
						<div class="ma-icon ma-warning pulseWarning">
							<span class="ma-body pulseWarningIns"></span>
							<span class="ma-dot pulseWarningIns"></span>
						</div>
						<h3 class="title_warning">是否删除？</h3>
						<p class="m-t-md">
							<span class="text_warning"></span>
						</p>
					</div>
					<div class="modal-footer text-center border0">
						<button type="button" class="custom-btn custom-btn-default " data-dismiss="modal" @click="deleteItem()" >确认
						</button>
						<button type="button" class="custom-btn custom-btn-primary " data-dismiss="modal">关闭
						</button>
					</div>
				</div>
			</div>
		
		</div>
		<!--主题内容结束-->
		<div class="modal fade" id="addData" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
			<div class="modal-dialog" style="width: 800px">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
						<h4 class="modal-title" id="myModalLabel" v-if="type == 0">添加数据</h4>
						<h4 class="modal-title" id="myModalLabel" v-else>修改数据</h4>
					</div>
					<div class="modal-body">
						<form class="form-horizontal m-t-lg" role="form" id="form1">

							<div class="form-group">
								<label class="col-sm-2 control-label"><span class="text-danger">*</span>名称：</label>
								<div class="col-sm-8">
									<input v-model="data.name" class="form-control">
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-2 control-label"><span class="text-danger">*</span>提示词：</label>
								<div class="col-sm-8">
									<textarea class="form-control" v-model="data.prompt" style="width:100%; min-height: 300px;">
									</textarea>
									
								</div>
							</div>
							
							<div class="form-group">
								<label class="col-sm-2 control-label"><span class="text-danger">*</span>分类：</label>
								<div class="col-sm-8">
									<select class="form-control" v-model="data.classId">
										<option value="-1" selected="selected">分类</option>
										<option v-for="(item,index) in classes" :value="item.id" >{{item.name}}</option>
									</select>
								</div>
							</div>							
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="custom-btn  custom-btn-default" data-dismiss="modal" id="cancelItem">取消</button>
						<button type="button" class="custom-btn modalhide custom-btn-primary" id="" @click="saveData()">确定</button>
					</div>
				</div>
			</div>

		</div>


	</div>
</div>
<script src="./page/vue/prompt_vue.js"></script>
